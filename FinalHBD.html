<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💜 3D Birthday Surprise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0015;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ===== UI OVERLAY ===== */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-3d {
            background: rgba(40, 15, 55, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(180, 100, 210, 0.4);
            border-radius: 60px 60px 40px 40px;
            padding: 40px 35px 45px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 2px #6a2e7a inset, 0 0 60px #9b4dca40;
            transition: 0.3s;
            pointer-events: auto;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-3d:hover {
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.9), 0 0 0 3px #a55ac7 inset, 0 0 70px #b86bdb60;
        }

        .content-wrapper {
            width: 100%;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .content-wrapper.hidden {
            opacity: 0;
            transform: scale(0.85) rotateY(20deg);
            pointer-events: none;
            position: absolute;
            width: 100%;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #e8c8f5;
            text-shadow: 0 0 30px #c084d8, 0 4px 10px #2d0f33;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .sub {
            font-size: 1rem;
            color: #d9b0e8;
            text-shadow: 0 0 12px #b06ac9;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ===== GIFT BOX (3D styled) ===== */
        .gift-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px auto 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
            width: fit-content;
        }

        .gift-wrapper:active {
            transform: scale(0.88);
        }

        .gift-icon {
            font-size: 90px;
            line-height: 1;
            filter: drop-shadow(0 0 40px #c575e6);
            transition: 0.3s;
            animation: giftPulse 2.5s infinite ease-in-out;
            user-select: none;
        }

        .gift-icon:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 70px #d99af0);
        }

        @keyframes giftPulse {
            0%,
            100% {
                transform: scale(1) rotate(-2deg);
            }
            50% {
                transform: scale(1.06) rotate(2deg);
            }
        }

        .tap-hint {
            font-size: 0.9rem;
            color: #b582cc;
            margin: 2px 0 8px;
            background: rgba(80, 30, 100, 0.4);
            padding: 5px 18px;
            border-radius: 50px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border: 1px solid #aa66c9;
            letter-spacing: 0.8px;
        }

        /* ===== PIN SECTION ===== */
        .pin-section {
            display: none;
            margin-top: 2px;
            animation: fadeSlideUp 0.5s ease forwards;
            padding: 0 2px;
            width: 100%;
        }

        .pin-section.show {
            display: block;
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .pin-display {
            background: rgba(40, 15, 55, 0.7);
            border: 2px solid #b06bc9;
            border-radius: 28px;
            padding: 6px 10px;
            margin-bottom: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f0defa;
            letter-spacing: 6px;
            text-shadow: 0 0 12px #c98ae0;
            min-height: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 16px #6b2f7e40;
        }

        .pin-display .placeholder {
            color: #7a4d8a;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            font-weight: 200;
        }

        .pin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-width: 180px;
            margin: 0 auto 4px;
        }

        .pin-btn {
            background: rgba(100, 40, 130, 0.4);
            border: 2px solid #8f4ca8;
            border-radius: 12px;
            padding: 7px 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f0defa;
            cursor: pointer;
            transition: 0.15s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            text-shadow: 0 0 6px #b06ec9;
        }

        .pin-btn:hover {
            background: rgba(130, 60, 165, 0.6);
            border-color: #c98ae0;
            transform: scale(1.04);
            box-shadow: 0 0 30px #9f4bc0;
        }

        .pin-btn:active {
            transform: scale(0.92);
        }

        .pin-btn.zero {
            grid-column: 2 / 3;
        }

        .pin-btn.clear {
            background: rgba(180, 50, 80, 0.3);
            border-color: #a04060;
            font-size: 0.8rem;
            color: #e8b0c8;
        }

        .pin-btn.clear:hover {
            background: rgba(200, 60, 90, 0.5);
            border-color: #d07090;
        }

        .pin-error {
            color: #ff7b9e;
            font-size: 0.75rem;
            min-height: 16px;
            margin-top: 2px;
            text-shadow: 0 0 16px #ff3d6b;
        }

        /* ===== OPEN BUTTON ===== */
        .open-section {
            display: none;
            animation: fadeSlideUp 0.6s ease forwards;
            width: 100%;
        }

        .open-section.show {
            display: block;
        }

        .open-btn {
            display: inline-block;
            background: linear-gradient(145deg, #7a2a9e, #4a1a5e);
            border: 2px solid #c98ae0;
            border-radius: 60px;
            padding: 18px 50px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #f0defa;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 0 40px #9f4bc0, 0 0 80px #7a31a040;
            text-shadow: 0 0 20px #c98ae0;
            letter-spacing: 3px;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }

        .open-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px #c575e6, 0 0 120px #9f4bc060;
            border-color: #d99af0;
            background: linear-gradient(145deg, #8f35b0, #5a2070);
        }

        .open-btn:active {
            transform: scale(0.94);
        }

        .open-btn .small-text {
            display: block;
            font-size: 0.65rem;
            font-weight: 300;
            opacity: 0.6;
            margin-top: 3px;
            letter-spacing: 1px;
        }

        .footer-note {
            margin-top: 22px;
            font-size: 0.8rem;
            color: #9f72b3;
            letter-spacing: 0.5px;
            border-top: 1px solid #773d8a;
            padding-top: 14px;
            opacity: 0.5;
            width: 100%;
        }

        .guestbook-toggle {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 1001;
            padding: 9px 15px;
            color: #f0defa;
            font: inherit;
            font-size: 0.85rem;
            background: rgba(80, 30, 100, 0.85);
            border: 1px solid #aa66c9;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .guestbook-toggle:hover {
            background: rgba(120, 45, 150, 0.95);
            border-color: #d9a0ed;
        }

        .guestbook-panel {
            position: fixed;
            left: 20px;
            bottom: 72px;
            z-index: 1001;
            width: min(380px, calc(100vw - 40px));
            max-height: min(70vh, 620px);
            overflow-y: auto;
            padding: 20px;
            color: #f0defa;
            background: rgba(30, 10, 40, 0.97);
            border: 1px solid #aa66c9;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(14px);
        }

        .guestbook-panel[hidden] {
            display: none;
        }

        .guestbook-panel h2 {
            margin-bottom: 8px;
            color: #e8c8f5;
            font-size: 1.3rem;
        }

        .guestbook-form {
            display: grid;
            gap: 8px;
            margin-top: 14px;
        }

        .guestbook-form label {
            color: #e8c8f5;
            font-size: 0.85rem;
        }

        .guestbook-form input,
        .guestbook-form textarea {
            width: 100%;
            padding: 9px 11px;
            color: #f0defa;
            font: inherit;
            font-size: 0.9rem;
            background: rgba(20, 5, 30, 0.8);
            border: 1px solid #8f4ca8;
            border-radius: 10px;
        }

        .guestbook-form textarea {
            min-height: 82px;
            resize: vertical;
        }

        .guestbook-form input:focus,
        .guestbook-form textarea:focus {
            outline: 2px solid #c98ae0;
            outline-offset: 1px;
        }

        .guestbook-form button {
            justify-self: start;
            margin-top: 4px;
            padding: 9px 16px;
            color: #f0defa;
            font: inherit;
            font-weight: 600;
            background: linear-gradient(145deg, #7a2a9e, #4a1a5e);
            border: 1px solid #c98ae0;
            border-radius: 30px;
            cursor: pointer;
        }

        .guestbook-form button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .guestbook-status {
            margin-top: 10px;
            color: #d9b0e8;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .card-3d {
                padding: 30px 18px 35px;
                min-height: 280px;
            }
            h1 {
                font-size: 2rem;
            }
            .gift-icon {
                font-size: 70px;
            }
            .pin-btn {
                font-size: 0.85rem;
                padding: 6px 0;
            }
            .pin-display {
                font-size: 0.95rem;
                padding: 5px 8px;
            }
            .open-btn {
                font-size: 1.5rem;
                padding: 15px 30px;
            }
            .guestbook-toggle {
                bottom: 10px;
                left: 10px;
                font-size: 0.75rem;
                padding: 7px 11px;
            }
            .guestbook-panel {
                left: 10px;
                bottom: 58px;
                width: calc(100vw - 20px);
            }
        }

        /* ===== 3D CANVAS ===== */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ===== TRANSITION OVERLAY ===== */
        .transition-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .transition-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .transition-overlay .loading-icon {
            font-size: 3.5rem;
            animation: glowPulse 0.9s ease-in-out infinite alternate;
        }

        .transition-overlay .loading-dots {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .transition-overlay .loading-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f0defa;
            display: inline-block;
            animation: bounceDot 0.9s infinite ease-in-out;
            box-shadow: 0 0 10px #c98ae0;
        }

        .transition-overlay .loading-dots span:nth-child(2) {
            animation-delay: 0.20s;
        }
        .transition-overlay .loading-dots span:nth-child(3) {
            animation-delay: 0.8s;
        }

        .transition-overlay .loading-text {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e8c8f5;
            margin-top: 8px;
            animation: fadeText 1s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            from {
                transform: scale(0.9);
                opacity: 0.7;
            }
            to {
                transform: scale(1.12);
                opacity: 1;
            }
        }

        @keyframes bounceDot {
            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.6;
            }
            40% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        @keyframes fadeText {
            from {
                opacity: 0.6;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 3D CANVAS ===== -->
    <div id="three-canvas"></div>

    <!-- ===== UI OVERLAY ===== -->
    <div id="ui-overlay">
        <div class="card-3d" id="mainCard">
            <div class="content-wrapper" id="contentWrapper">
                <h1>💜 Surprise</h1>
                <div class="sub">A magical experience awaits...</div>

                <div class="gift-wrapper" id="giftWrapper">
                    <div class="gift-icon" id="giftIcon">🎁</div>
                </div>
                <div class="tap-hint" id="giftHint">✨ Tap the gift to open! ✨</div>

                <div class="pin-section" id="pinSection">
                    <div class="pin-display" id="pinDisplay">
                        <span class="placeholder">Enter PIN</span>
                    </div>
                    <div class="pin-grid">
                        <button class="pin-btn" data-value="1">1</button>
                        <button class="pin-btn" data-value="2">2</button>
                        <button class="pin-btn" data-value="3">3</button>
                        <button class="pin-btn" data-value="4">4</button>
                        <button class="pin-btn" data-value="5">5</button>
                        <button class="pin-btn" data-value="6">6</button>
                        <button class="pin-btn" data-value="7">7</button>
                        <button class="pin-btn" data-value="8">8</button>
                        <button class="pin-btn" data-value="9">9</button>
                        <button class="pin-btn clear" data-value="clear">⌫</button>
                        <button class="pin-btn zero" data-value="0">0</button>
                        <button class="pin-btn" data-value="enter" style="background:rgba(80,180,80,0.3);border-color:#5aaa5a;">✓</button>
                    </div>
                    <div class="pin-error" id="pinError"></div>
                </div>

                <div class="footer-note">made with 💜 for you</div>
            </div>

            <div class="open-section" id="openSection">
                <button class="open-btn" id="openBtn">🚀 Open</button>
            </div>
        </div>
    </div>

    <!-- ===== TRANSITION OVERLAY ===== -->
    <div class="transition-overlay" id="transitionOverlay">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
            <div class="loading-icon">✨</div>
            <div class="loading-dots">
                <span></span><span></span><span></span>
            </div>
            <div class="loading-text">LOADING....</div>
        </div>
    </div>

    <button class="guestbook-toggle" id="guestbookToggle" type="button" aria-expanded="false" aria-controls="guestbookPanel">💌 Send a Wish</button>
    <section class="guestbook-panel" id="guestbookPanel" aria-labelledby="guestbookTitle" hidden>
        <h2 id="guestbookTitle">💜 Send a Birthday Wish</h2>
        <form class="guestbook-form" id="guestbookForm">
            <label for="guestbookName">Your name</label>
            <input id="guestbookName" name="name" type="text" maxlength="40" autocomplete="name" required />
            <label for="guestbookMessage">Your birthday wish</label>
            <textarea id="guestbookMessage" name="message" maxlength="500" required></textarea>
            <button id="guestbookSubmit" type="submit">💌 Share your wish</button>
        </form>
        <p class="guestbook-status" id="guestbookStatus" role="status" aria-live="polite"></p>
    </section>

    <script>
        const guestbookToggle = document.getElementById('guestbookToggle');
        const guestbookPanel = document.getElementById('guestbookPanel');
        const guestbookForm = document.getElementById('guestbookForm');
        const guestbookStatus = document.getElementById('guestbookStatus');
        const guestbookSubmit = document.getElementById('guestbookSubmit');

        async function readGuestbookResponse(response) {
            if (!response.headers.get('content-type')?.includes('application/json')) {
                throw new Error('Could not send your wish.');
            }
            return response.json();
        }

        guestbookToggle.addEventListener('click', () => {
            const isOpen = guestbookToggle.getAttribute('aria-expanded') === 'true';
            guestbookToggle.setAttribute('aria-expanded', String(!isOpen));
            guestbookPanel.hidden = isOpen;
            if (!isOpen) {
                document.getElementById('guestbookName').focus();
            }
        });

        guestbookForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            guestbookSubmit.disabled = true;
            guestbookStatus.textContent = 'Saving your wish...';
            try {
                const formData = new FormData(guestbookForm);
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: formData.get('name'),
                        message: formData.get('message'),
                        source: 'FinalHBD'
                    })
                });
                const result = await readGuestbookResponse(response);
                if (!response.ok) {
                    throw new Error(result.error || 'Could not save your wish.');
                }
                guestbookForm.reset();
                guestbookStatus.textContent = 'Your birthday wish has been shared! 💜';
            } catch (error) {
                guestbookStatus.textContent = error.message;
            } finally {
                guestbookSubmit.disabled = false;
            }
        });
    </script>

    <!-- ===== THREE.JS ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ============================================================
        // 1. SCENE SETUP
        // ============================================================
        const container = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(5, 4, 8);
        camera.lookAt(0, 0.5, 0);

        // WebGL Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Controls (auto-rotate with gentle damping)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.target.set(0, 0.8, 0);
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 3;
        controls.maxDistance = 15;
        controls.enablePan = false;

        // ============================================================
        // 2. LIGHTING
        // ============================================================
        const ambient = new THREE.AmbientLight(0x223366, 0.5);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffddbb, 1.2);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.6);
        fillLight.position.set(-4, 3, 5);
        scene.add(fillLight);

        const rimLight = new THREE.PointLight(0xff66aa, 0.8, 12);
        rimLight.position.set(-3, 2, -5);
        scene.add(rimLight);

        const glowLight = new THREE.PointLight(0xaa44ff, 1.5, 8);
        glowLight.position.set(0, 2, 0);
        scene.add(glowLight);

        // ============================================================
        // 3. STARFIELD
        // ============================================================
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const r = 30 + Math.random() * 70;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = Math.abs(r * Math.cos(phi));
            starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            starSizes[i] = 0.1 + Math.random() * 0.3;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

        const starMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.15,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starsGeo, starMat);
        scene.add(stars);

        // ============================================================
        // 4. GROUND / PLATFORM
        // ============================================================
        const groundGeo = new THREE.CircleGeometry(6, 64);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x1a0a2e,
            roughness: 0.8,
            metalness: 0.2,
            transparent: true,
            opacity: 0.7,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        ground.receiveShadow = true;
        scene.add(ground);

        // Glow ring on ground
        const ringGeo = new THREE.RingGeometry(1.8, 2.4, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x8844aa,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.2,
            blending: THREE.AdditiveBlending
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.01;
        scene.add(ring);

        // ============================================================
        // 5. FLOATING HEART PARTICLES (background)
        // ============================================================
        const heartParticles = [];
        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        function createHeartShape() {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.bezierCurveTo(0, -0.15, -0.2, -0.3, -0.4, -0.2);
            shape.bezierCurveTo(-0.6, -0.1, -0.6, 0.15, -0.4, 0.3);
            shape.bezierCurveTo(-0.2, 0.45, 0, 0.35, 0, 0.5);
            shape.bezierCurveTo(0, 0.35, 0.2, 0.45, 0.4, 0.3);
            shape.bezierCurveTo(0.6, 0.15, 0.6, -0.1, 0.4, -0.2);
            shape.bezierCurveTo(0.2, -0.3, 0, -0.15, 0, 0);
            return shape;
        }

        const heartShape = createHeartShape();
        const heartGeo = new THREE.ShapeGeometry(heartShape);

        for (let i = 0; i < 30; i++) {
            const mat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(0.75 + Math.random() * 0.15, 0.8, 0.5 + Math.random() * 0.3),
                transparent: true,
                opacity: 0.15 + Math.random() * 0.15,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(heartGeo.clone(), mat);
            const r = 1.5 + Math.random() * 4;
            const angle = Math.random() * Math.PI * 2;
            mesh.position.set(
                Math.cos(angle) * r,
                0.3 + Math.random() * 3.5,
                Math.sin(angle) * r
            );
            const scale = 0.04 + Math.random() * 0.08;
            mesh.scale.set(scale, scale, scale);
            mesh.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            mesh.userData = {
                phase: Math.random() * 100,
                speed: 0.2 + Math.random() * 0.3,
                rotSpeed: 0.3 + Math.random() * 0.5,
                floatAmp: 0.1 + Math.random() * 0.3,
                baseY: mesh.position.y,
                baseAngle: angle,
                radius: r
            };
            heartGroup.add(mesh);
            heartParticles.push(mesh);
        }

        // ============================================================
        // 6. 3D GIFT BOX (interactive)
        // ============================================================
        const giftBoxGroup = new THREE.Group();
        scene.add(giftBoxGroup);

        // Box body
        const boxGeo = new THREE.BoxGeometry(0.9, 0.7, 0.9);
        const boxMat = new THREE.MeshStandardMaterial({
            color: 0x7a2a9e,
            roughness: 0.3,
            metalness: 0.4,
            emissive: 0x4a1a5e,
            emissiveIntensity: 0.2,
        });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.castShadow = true;
        box.receiveShadow = true;
        box.position.y = 0.35;
        giftBoxGroup.add(box);

        // Ribbon (cross)
        const ribbonMat = new THREE.MeshStandardMaterial({
            color: 0xc98ae0,
            roughness: 0.3,
            metalness: 0.2,
            emissive: 0x8844aa,
            emissiveIntensity: 0.15,
        });

        const ribbon1 = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.05, 0.12), ribbonMat);
        ribbon1.position.y = 0.35;
        giftBoxGroup.add(ribbon1);

        const ribbon2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.95), ribbonMat);
        ribbon2.position.y = 0.35;
        giftBoxGroup.add(ribbon2);

        // Bow (top)
        const bowMat = new THREE.MeshStandardMaterial({
            color: 0xd99af0,
            roughness: 0.2,
            metalness: 0.3,
            emissive: 0xaa66cc,
            emissiveIntensity: 0.2,
        });

        for (let i = 0; i < 4; i++) {
            const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
            const bow = new THREE.Mesh(
                new THREE.TorusGeometry(0.12, 0.04, 8, 12),
                bowMat
            );
            bow.position.set(Math.cos(angle) * 0.08, 0.75, Math.sin(angle) * 0.08);
            bow.rotation.x = Math.PI / 2;
            bow.rotation.z = angle;
            bow.scale.set(1, 1, 0.5);
            giftBoxGroup.add(bow);
        }

        // Glow aura
        const auraGeo = new THREE.SphereGeometry(0.6, 16, 16);
        const auraMat = new THREE.MeshBasicMaterial({
            color: 0xaa44ff,
            transparent: true,
            opacity: 0.08,
            blending: THREE.AdditiveBlending,
        });
        const aura = new THREE.Mesh(auraGeo, auraMat);
        aura.position.y = 0.4;
        giftBoxGroup.add(aura);

        // Floating sparkles around gift
        const sparkles = [];
        for (let i = 0; i < 20; i++) {
            const sMat = new THREE.MeshBasicMaterial({
                color: 0xff88ff,
                transparent: true,
                opacity: 0.3 + Math.random() * 0.4,
                blending: THREE.AdditiveBlending,
            });
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.01 + Math.random() * 0.02, 4), sMat);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            const r = 0.5 + Math.random() * 0.4;
            s.position.set(
                Math.sin(phi) * Math.cos(theta) * r,
                0.4 + Math.sin(phi) * Math.sin(theta) * r,
                Math.sin(phi) * Math.cos(theta) * r * 0.5
            );
            s.userData = {
                phase: Math.random() * 100,
                speed: 1 + Math.random() * 2,
                basePos: s.position.clone(),
                r: r,
                theta: theta,
                phi: phi,
            };
            giftBoxGroup.add(s);
            sparkles.push(s);
        }

        giftBoxGroup.position.set(0, 0, 0);

        // ============================================================
        // 7. FLOATING HEARTS (released on gift tap)
        // ============================================================
        const releasedHearts = [];

        function releaseHearts(count = 30) {
            const colors = [0xff6b9d, 0xff3d7f, 0xff8aae, 0xff4d94, 0xff2d6a];
            for (let i = 0; i < count; i++) {
                const heart = new THREE.Mesh(
                    heartGeo.clone(),
                    new THREE.MeshBasicMaterial({
                        color: colors[Math.floor(Math.random() * colors.length)],
                        transparent: true,
                        opacity: 0.9,
                        blending: THREE.AdditiveBlending,
                        side: THREE.DoubleSide
                    })
                );
                const scale = 0.06 + Math.random() * 0.12;
                heart.scale.set(scale, scale, scale);
                heart.position.set(
                    (Math.random() - 0.5) * 0.5,
                    0.8 + Math.random() * 0.3,
                    (Math.random() - 0.5) * 0.5
                );
                heart.rotation.set(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );
                heart.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        1.5 + Math.random() * 3,
                        (Math.random() - 0.5) * 2
                    ),
                    rotSpeed: new THREE.Vector3(
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * 3
                    ),
                    life: 1.0,
                    decay: 0.003 + Math.random() * 0.005
                };
                scene.add(heart);
                releasedHearts.push(heart);
            }
        }

        // ============================================================
        // 8. INTERACTION: Gift tap detection (3D raycast)
        // ============================================================
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let isGiftOpened3D = false;
        let isUnlocked3D = false;
        let heartBurstDone = false;

        // Get UI elements from the HTML
        const giftWrapper = document.getElementById('giftWrapper');
        const giftIcon = document.getElementById('giftIcon');
        const giftHint = document.getElementById('giftHint');
        const pinSection = document.getElementById('pinSection');
        const pinDisplay = document.getElementById('pinDisplay');
        const pinError = document.getElementById('pinError');
        const contentWrapper = document.getElementById('contentWrapper');
        const openSection = document.getElementById('openSection');
        const openBtn = document.getElementById('openBtn');
        const transitionOverlay = document.getElementById('transitionOverlay');

        let correctPin = '13697'; // Default PIN
        let enteredPin = '';
        let websiteURL = 'HBD.html'; // Default URL to open after unlocking

        // Update open button
        function updateOpenButton() {
            openBtn.onclick = function() {
                if (!websiteURL) return;

                transitionOverlay.classList.add('show');

                setTimeout(() => {
                    window.open(websiteURL, '_blank');
                    setTimeout(() => {
                        transitionOverlay.classList.remove('show');
                    }, 300);
                }, 1200);
            };
        }
        updateOpenButton();


        // Click on gift box in 3D scene
        renderer.domElement.addEventListener('click', (event) => {
            if (isGiftOpened3D) return;

            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);

            // Check intersection with gift box children
            const intersects = raycaster.intersectObjects(giftBoxGroup.children, true);
            if (intersects.length > 0) {
                openGift3D();
            }
        });

        // Also listen to the UI gift wrapper click
        giftWrapper.addEventListener('click', openGift3D);

        function openGift3D() {
            if (isGiftOpened3D) return;
            isGiftOpened3D = true;

            // Animate gift: scale up and pulse
            giftBoxGroup.scale.set(1, 1, 1);
            giftBoxGroup.userData.bursting = true;

            // Release hearts
            releaseHearts(40);

            // Update UI
            giftIcon.textContent = '🎁';
            giftIcon.style.animation = 'none';
            giftIcon.style.transform = 'scale(0.9)';
            giftHint.textContent = '✨ opened! ✨';

            // Show PIN section after delay
            setTimeout(() => {
                pinSection.classList.add('show');
                pinDisplay.innerHTML = `<span class="placeholder">Enter PIN</span>`;
                enteredPin = '';
                pinError.textContent = '';
            }, 600);
        }

        // ============================================================
        // 9. PIN LOGIC (from UI)
        // ============================================================
        document.querySelectorAll('.pin-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (isUnlocked3D) return;
                const val = this.dataset.value;

                if (val === 'clear') {
                    enteredPin = enteredPin.slice(0, -1);
                } else if (val === 'enter') {
                    checkPin3D();
                    return;
                } else {
                    if (enteredPin.length < 6) {
                        enteredPin += val;
                    }
                }
                updatePinDisplay3D();
                pinError.textContent = '';
            });
        });

        function updatePinDisplay3D() {
            if (enteredPin.length === 0) {
                pinDisplay.innerHTML = `<span class="placeholder">Enter PIN</span>`;
            } else {
                pinDisplay.textContent = '•'.repeat(enteredPin.length);
            }
        }

        function checkPin3D() {
            if (enteredPin === correctPin) {
                isUnlocked3D = true;

                // Hide everything, show open button
                contentWrapper.classList.add('hidden');
                openSection.classList.add('show');

                // Massive heart burst in 3D
                releaseHearts(80);

                // Flash the gift
                giftBoxGroup.userData.unlocked = true;

            } else {
                pinError.textContent = '❌ Wrong PIN! Try again.';
                pinError.style.color = '#ff7b9e';
                enteredPin = '';
                updatePinDisplay3D();

                pinDisplay.style.animation = 'shake 0.3s ease';
                setTimeout(() => {
                    pinDisplay.style.animation = '';
                }, 300);
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (isUnlocked3D) return;
            if (!pinSection.classList.contains('show')) return;

            const key = e.key;
            if (key >= '0' && key <= '9') {
                if (enteredPin.length < 6) {
                    enteredPin += key;
                    updatePinDisplay3D();
                    pinError.textContent = '';
                }
            } else if (key === 'Backspace') {
                enteredPin = enteredPin.slice(0, -1);
                updatePinDisplay3D();
                pinError.textContent = '';
            } else if (key === 'Enter') {
                checkPin3D();
            }
        });

        // ============================================================
        // 10. OPEN BUTTON
        // ============================================================
        openBtn.addEventListener('click', () => {
            transitionOverlay.classList.add('show');
            setTimeout(() => {
                transitionOverlay.classList.remove('show');
                // Simulate opening a portal
                releaseHearts(100);
                // The user can double-click the 3D scene to trigger more magic
            }, 1200);
        });

        // ============================================================
        // 11. DOUBLE-CLICK 3D SCENE FOR HEART EXPLOSION
        // ============================================================
        renderer.domElement.addEventListener('dblclick', () => {
            releaseHearts(60);
        });

        // ============================================================
        // 12. ANIMATION LOOP
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const time = performance.now() / 1000;

            // Auto-rotate
            controls.update();

            // Rotate gift box slowly
            giftBoxGroup.rotation.y += delta * 0.3;

            // Gift box pulse when opened
            if (giftBoxGroup.userData.bursting) {
                const pulse = 1 + Math.sin(time * 4) * 0.03;
                giftBoxGroup.scale.set(pulse, pulse, pulse);
            }

            // Sparkles around gift
            sparkles.forEach((s) => {
                const d = s.userData;
                d.theta += delta * d.speed * 0.5;
                d.phi += delta * d.speed * 0.3;
                const r = d.r + Math.sin(time * d.speed + d.phase) * 0.05;
                s.position.set(
                    Math.sin(d.phi) * Math.cos(d.theta) * r,
                    0.4 + Math.sin(d.phi) * Math.sin(d.theta) * r * 0.7,
                    Math.sin(d.phi) * Math.cos(d.theta) * r * 0.5
                );
                s.material.opacity = 0.2 + Math.sin(time * d.speed + d.phase) * 0.2 + 0.3;
            });

            // Floating heart particles (background)
            heartParticles.forEach((h) => {
                const d = h.userData;
                h.position.y = d.baseY + Math.sin(time * d.speed + d.phase) * d.floatAmp;
                h.rotation.x += delta * d.rotSpeed * 0.5;
                h.rotation.y += delta * d.rotSpeed * 0.7;
                h.rotation.z += delta * d.rotSpeed * 0.3;
            });

            // Released hearts animation
            for (let i = releasedHearts.length - 1; i >= 0; i--) {
                const h = releasedHearts[i];
                h.position.add(h.userData.velocity.clone().multiplyScalar(delta));
                h.userData.velocity.y -= delta * 0.5;
                h.rotation.x += delta * h.userData.rotSpeed.x;
                h.rotation.y += delta * h.userData.rotSpeed.y;
                h.userData.life -= h.userData.decay;
                h.material.opacity = h.userData.life;
                const s = 0.06 + 0.12 * h.userData.life;
                h.scale.set(s, s, s);
                if (h.userData.life <= 0) {
                    scene.remove(h);
                    releasedHearts.splice(i, 1);
                }
            }

            // Stars rotation
            stars.rotation.y += delta * 0.005;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // ============================================================
        // 13. RESIZE
        // ============================================================
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ============================================================
        // 14. INITIAL HEART BURST ON LOAD
        // ============================================================
        setTimeout(() => {
            releaseHearts(20);
        }, 500);

        console.log('💜 Birthday Surprise gift box!');
        console.log('🔑 Default PIN: 13697');
        console.log('🔗 Default URL: HBD.html');
        console.log('⚙️ Click settings to change PIN or URL!');   
    </script>

</body>
</html>
